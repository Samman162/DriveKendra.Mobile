name: Drive Kendra CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Static Typecheck & Code Validation
  typecheck-and-lint:
    name: TypeScript Static Analysis & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Client Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Client TypeScript Typecheck
        run: npm run typecheck

      - name: Server TypeScript Typecheck
        run: npm run typecheck --prefix server

  # 2. Automated Test Suites
  unit-tests:
    name: Jest Unit & Integration Test Suites
    needs: typecheck-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps
          npm ci --prefix server

      - name: Run Client Jest Tests
        run: npm test -- --ci --maxWorkers=2

      - name: Run Server Jest Tests
        run: npm test --prefix server -- --ci --maxWorkers=2

  # 3. EAS Build Verification
  eas-build-check:
    name: EAS Build Verification
    needs: [typecheck-and-lint, unit-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate EAS Build Configuration
        run: npx eas-cli config:view
